name: Build GIPI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Compose Project
        run: |
          mkdir -p android-project/app/src/main/java/com/gipi/app
          mkdir -p android-project/app/src/main/res/values
          cp MainActivity.kt android-project/app/src/main/java/com/gipi/app/MainActivity.kt

          cat << 'EOF' > android-project/settings.gradle.kts
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "GIPI.Com"
          include(":app")
          EOF

          cat << 'EOF' > android-project/build.gradle.kts
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > android-project/app/build.gradle.kts
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }

          android {
            namespace = "com.gipi.app"
            compileSdk = 34

            defaultConfig {
              applicationId = "com.gipi.app"
              minSdk = 24
              targetSdk = 34
              versionCode = 1
              versionName = "1.0"
            }

            buildTypes {
              release {
                isMinifyEnabled = false
              }
            }

            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
              jvmTarget = "17"
            }

            buildFeatures {
              compose = true
            }

            composeOptions {
              kotlinCompilerExtensionVersion = "1.5.14"
            }
          }

          dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
            implementation("androidx.activity:activity-compose:1.9.1")
            implementation(platform("androidx.compose:compose-bom:2024.06.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:label="GIPI.Com"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android:intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
            <string name="app_name">GIPI.Com</string>
          </resources>
          EOF

          gradle wrapper --gradle-version 8.7 --distribution-type bin -p android-project || true

      - name: Build Debug APK
        run: |
          cd android-project
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIPI-Com-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          
